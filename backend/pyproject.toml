[project]
name = "aerona"
version = "0.1.0"
description = "Weavers of the Void backend: a self-generating pantheon and lore engine"
authors = [
    { name = "Ege Dogan Dursun" }
]
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "aiobotocore>=3.10.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "claude-agent-sdk>=0.2.175",
    "ebooklib>=0.21",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "jinja2>=3.1.6",
    "langdetect>=1.0.9",
    "markdown-it-py>=4.2.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.9",
    "numpy>=2.5.4",
    "onnxruntime>=1.32.0",
    "pillow>=13.0.0",
    "pycountry>=26.2.16",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "sse-starlette>=3.6.0",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "import-linter>=2.15",
    "moto[server]>=5.2.5",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "types-aiobotocore[s3]>=3.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
markers = ["tool_failure_expected: the test makes a tool crash on purpose", "bond_downgrade_expected: the test asks for a bond its ends cannot hold on purpose"]
filterwarnings = ["error::sqlalchemy.exc.SADeprecationWarning", "error:fully NULL primary key identity:sqlalchemy.exc.SAWarning", "error::DeprecationWarning:aerona", "error::DeprecationWarning:tests", "error:coroutine .* was never awaited:RuntimeWarning", "error::pytest.PytestUnraisableExceptionWarning", "error::aerona.db.record_context.TermFlood", "error:DELETE statement on table:sqlalchemy.exc.SAWarning", "error:Identity map already had an identity:sqlalchemy.exc.SAWarning", "error::aerona.engine.primitives.stats.MisroutedStanding", "error::aerona.db.key_moves.PrimaryKeyMoved"]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "N", "PIE794"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
strict = true
enable_error_code = ["deprecated"]
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aerona.db.alembic.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "weasyprint", "weasyprint.*", "onnxruntime", "onnxruntime.*", "langdetect", "langdetect.*", "pycountry", "pycountry.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "aerona"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "aerona.main | aerona.migration",
  "aerona.api",
  "aerona.services",
  "aerona.epoch",
  "aerona.agents | aerona.jobs",
  "aerona.tools",
  "aerona.engine | aerona.llm | aerona.imaging | aerona.media",
  "aerona.prompts | aerona.language | aerona.cartography",
  "aerona.db",
  "aerona.events",
  "aerona.catalog",
  "aerona.rules",
  "aerona.core",
  "aerona.domain",
  "aerona.constants",
]

[tool.ruff.lint.per-file-ignores]
"src/aerona/rules/registry/*" = ["E501"]
"src/aerona/prompts/*" = ["E501"]
"src/aerona/db/alembic/versions/*" = ["E501", "PLR0915"]
"../scripts/anatomy/*" = ["E501"]

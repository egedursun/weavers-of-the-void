<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="5" />
    <meta name="theme-color" content="#13111d" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <title>Weavers of the Void® · Reconnecting</title>
    <style>
      :root {
        color-scheme: dark light;
        --ground: oklch(0.135 0.04 291);
        --ink: oklch(0.94 0.012 290);
        --mute: oklch(0.72 0.03 290);
        --accent: oklch(0.86 0.168 89);
        --frame: oklch(0.86 0.168 89 / 0.35);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --ground: oklch(0.975 0.012 86);
          --ink: oklch(0.22 0.09 292);
          --mute: oklch(0.42 0.06 292);
          --accent: oklch(0.48 0.22 302);
          --frame: oklch(0.48 0.22 302 / 0.35);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: var(--ground);
        color: var(--ink);
        font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 32rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 2.5rem 1.5rem;
        border: 1px dashed var(--frame);
        border-radius: 0.75rem;
        text-align: center;
      }
      .mark {
        position: relative;
        width: 6rem;
        height: 6rem;
      }
      .mark::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: var(--accent);
        opacity: 0.2;
        filter: blur(24px);
        animation: breathe 2.8s ease-in-out infinite;
      }
      .mark img {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        color: var(--accent);
        font-family: 'Cinzel', 'Iowan Old Style', Georgia, serif;
        font-size: 1.25rem;
        font-variant: small-caps;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        color: var(--mute);
        line-height: 1.6;
      }
      a {
        color: var(--accent);
        font-family: 'Cinzel', 'Iowan Old Style', Georgia, serif;
        font-variant: small-caps;
        letter-spacing: 0.04em;
        text-decoration: none;
        padding: 0.5rem 1.5rem;
        border: 1px solid var(--frame);
        border-radius: 0.5rem;
      }
      a:hover,
      a:focus-visible {
        border-color: var(--accent);
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(0.94);
          opacity: 0.12;
        }
        50% {
          transform: scale(1.06);
          opacity: 0.3;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="mark">
        <img src="/brand/logo-192.webp" alt="" width="96" height="96" />
      </div>
      <h1>The server cannot be reached</h1>
      <p>
        It may be starting or restarting. This page tries again every few
        seconds and opens what you asked for as soon as the server answers.
      </p>
      <a href="">Try now</a>
    </main>
  </body>
</html>

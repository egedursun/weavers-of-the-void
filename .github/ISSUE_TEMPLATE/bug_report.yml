name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The steps that lead to the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in the app, or the commit you run.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How you run it
      options:
        - Local development (make dev)
        - Docker Compose
        - A hosted service
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Backend log lines, browser console errors or screenshots. Remove API keys and other secrets first.
      render: text

name: aerona

services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: aerona-backend:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      AERONA_DATA_DIR: /data
      AERONA_HOST: 0.0.0.0
      AERONA_PORT: "8000"
      AERONA_LIBRARY_OPEN_UNIVERSES: ${AERONA_LIBRARY_OPEN_UNIVERSES:-4}
      AERONA_LIBRARY_IDLE_MINUTES: ${AERONA_LIBRARY_IDLE_MINUTES:-20}
      AERONA_LIBRARY_PARALLEL_EPOCHS: ${AERONA_LIBRARY_PARALLEL_EPOCHS:-2}
      AERONA_LIBRARY_IMPORT_MAX_MB: ${AERONA_LIBRARY_IMPORT_MAX_MB:-2048}
      AERONA_LIBRARY_TRASH_DAYS: ${AERONA_LIBRARY_TRASH_DAYS:-30}
      AERONA_COOKIE_SECURE: ${AERONA_COOKIE_SECURE:-false}
      AERONA_ACCOUNTS_LOCKOUT_ATTEMPTS: ${AERONA_ACCOUNTS_LOCKOUT_ATTEMPTS:-5}
      AERONA_ACCOUNTS_LOCKOUT_MINUTES: ${AERONA_ACCOUNTS_LOCKOUT_MINUTES:-15}
      AERONA_ACCOUNTS_PASSWORD_MIN_LENGTH: ${AERONA_ACCOUNTS_PASSWORD_MIN_LENGTH:-10}
      AERONA_ACCOUNTS_SESSION_IDLE_DAYS: ${AERONA_ACCOUNTS_SESSION_IDLE_DAYS:-14}
      AERONA_ACCOUNTS_SESSION_MAX_DAYS: ${AERONA_ACCOUNTS_SESSION_MAX_DAYS:-60}
      AERONA_TEAM_PRESENCE_TTL_SECONDS: ${AERONA_TEAM_PRESENCE_TTL_SECONDS:-90}
      AERONA_TEAM_REASON_MAX_LENGTH: ${AERONA_TEAM_REASON_MAX_LENGTH:-500}
      AERONA_IMAGE_WORKER_URL: ${AERONA_DOCKER_IMAGE_WORKER_URL:-http://host.docker.internal:8100,http://image-worker:8100}
      AERONA_GATEWAY_URL: ${AERONA_DOCKER_GATEWAY_URL:-http://bifrost:8080}
      AERONA_SECRET_KEY: ${AERONA_SECRET_KEY:-}
      AERONA_MEDIA_BACKEND: s3
      AERONA_MEDIA_ENDPOINT: minio:9000
      AERONA_MEDIA_SECURE: "false"
      AERONA_MEDIA_BUCKET: ${AERONA_MEDIA_BUCKET:-aerona-media}
      AERONA_MEDIA_REGION: ${AERONA_MEDIA_REGION:-us-east-1}
      AERONA_MEDIA_ACCESS_KEY: ${AERONA_MEDIA_ACCESS_KEY:?Set AERONA_MEDIA_ACCESS_KEY in .env}
      AERONA_MEDIA_SECRET_KEY: ${AERONA_MEDIA_SECRET_KEY:?Set AERONA_MEDIA_SECRET_KEY in .env}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - aerona-data:/data
    ports:
      - "${AERONA_BIND_ADDRESS:-127.0.0.1}:${AERONA_BACKEND_PUBLISHED_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      bifrost:
        condition: service_healthy
      image-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  bifrost:
    image: maximhq/bifrost:v2.6.0
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
    volumes:
      - bifrost-data:/app/data
      - ./deploy/bifrost/config.json:/app/data/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: aerona-web:local
    restart: unless-stopped
    environment:
      AERONA_BACKEND_ORIGIN: http://backend:8000
    ports:
      - "${AERONA_BIND_ADDRESS:-127.0.0.1}:${AERONA_WEB_PUBLISHED_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  minio:
    image: ${AERONA_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AERONA_MEDIA_ACCESS_KEY:?Set AERONA_MEDIA_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${AERONA_MEDIA_SECRET_KEY:?Set AERONA_MEDIA_SECRET_KEY in .env}
      MINIO_BROWSER_REDIRECT: "false"
    volumes:
      - aerona-media:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  minio-init:
    image: ${AERONA_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AERONA_MEDIA_BUCKET: ${AERONA_MEDIA_BUCKET:-aerona-media}
      AERONA_MEDIA_ACCESS_KEY: ${AERONA_MEDIA_ACCESS_KEY:?Set AERONA_MEDIA_ACCESS_KEY in .env}
      AERONA_MEDIA_SECRET_KEY: ${AERONA_MEDIA_SECRET_KEY:?Set AERONA_MEDIA_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set aerona http://minio:9000 "$$AERONA_MEDIA_ACCESS_KEY" "$$AERONA_MEDIA_SECRET_KEY" && mc mb --ignore-existing "aerona/$$AERONA_MEDIA_BUCKET" && mc anonymous set none "aerona/$$AERONA_MEDIA_BUCKET"

  minio-console:
    profiles:
      - media-console
    image: ${AERONA_SOCAT_IMAGE:-alpine/socat:1.8.0.3}
    restart: unless-stopped
    command: ["tcp-listen:9001,fork,reuseaddr", "tcp-connect:minio:9001"]
    ports:
      - "127.0.0.1:${AERONA_MINIO_CONSOLE_PORT:-9001}:9001"
    depends_on:
      minio:
        condition: service_healthy

  image-worker:
    build:
      context: .
      dockerfile: deploy/image-worker.Dockerfile
    image: aerona-image-worker:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      AERONA_IMAGE_WORKER_BACKEND: diffusers
      AERONA_IMAGE_WORKER_HOST: 0.0.0.0
      AERONA_IMAGE_WORKER_PORT: "8100"
      AERONA_IMAGE_WORKER_MODEL_ID: ${AERONA_DOCKER_IMAGE_WORKER_MODEL_ID:-Tongyi-MAI/Z-Image-Turbo}
      AERONA_IMAGE_WORKER_LOAD_TIMEOUT_SECONDS: ${AERONA_DOCKER_IMAGE_WORKER_LOAD_TIMEOUT_SECONDS:-3600}
      AERONA_IMAGE_WORKER_IMAGE_TIMEOUT_SECONDS: ${AERONA_DOCKER_IMAGE_WORKER_IMAGE_TIMEOUT_SECONDS:-1800}
      HF_HOME: /models
    volumes:
      - aerona-models:/models
    ports:
      - "${AERONA_BIND_ADDRESS:-127.0.0.1}:${AERONA_IMAGE_WORKER_PUBLISHED_PORT:-8100}:8100"
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  aerona-data:
  bifrost-data:
  aerona-media:
  aerona-models:
